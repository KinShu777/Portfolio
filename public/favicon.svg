<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Antenna -->
  <line x1="20" y1="6" x2="30" y2="18" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="6" x2="34" y2="18" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="18" r="3" fill="#555"/>
  <!-- TV Outer Casing -->
  <rect x="4" y="16" width="56" height="42" rx="6" fill="#1c1d22" stroke="#33363f" stroke-width="2"/>
  <!-- Bezel -->
  <rect x="8" y="20" width="38" height="34" rx="4" fill="#0d0e12" stroke="#252730" stroke-width="1.5"/>
  <!-- Curved Screen Glass with Phosphor Glow -->
  <rect x="10" y="22" width="34" height="30" rx="3" fill="#001810"/>
  <path d="M12 24 Q27 23 42 24 Q41 37 42 50 Q27 51 12 50 Q13 37 12 24 Z" fill="#00e575" fill-opacity="0.3"/>
  <!-- Scanlines on icon -->
  <line x1="12" y1="28" x2="42" y2="28" stroke="#00e575" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="12" y1="36" x2="42" y2="36" stroke="#00e575" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="12" y1="44" x2="42" y2="44" stroke="#00e575" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Right control panel -->
  <circle cx="52" cy="26" r="3.5" fill="#3a3d47" stroke="#222" stroke-width="1"/>
  <circle cx="52" cy="36" r="3.5" fill="#3a3d47" stroke="#222" stroke-width="1"/>
  <!-- Speaker slits -->
  <line x1="48" y1="46" x2="56" y2="46" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="49" x2="56" y2="49" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="48" y1="52" x2="56" y2="52" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Power LED -->
  <circle cx="12" cy="56" r="1.5" fill="#00ff66"/>
</svg>